name: Verification

on:
  push:
    branches:
      - main
      - "version-*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and package JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify project
        run: npm run check

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: simple-db-vsix
          path: "*.vsix"
          if-no-files-found: error
